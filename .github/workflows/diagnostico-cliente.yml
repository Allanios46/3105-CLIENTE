
name: Diagnostico IPA Cliente

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  diagnostico:
    runs-on: macos-14

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Selecionar Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Extrair projeto
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 2 -type f -iname '*.zip' -print -quit)"
          if [ -z "$ZIP" ]; then
            echo "ERRO: nenhum ZIP encontrado."
            exit 1
          fi
          mkdir -p extracted
          ditto -x -k "$ZIP" extracted
          echo "ZIP extraido: $ZIP"

      - name: Identificar projeto e schemes
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Estrutura do projeto ==="
          find extracted -maxdepth 4 -print | head -300

          PROJECT="$(find extracted -type d -name '*.xcodeproj' -print -quit)"
          WORKSPACE="$(find extracted -type d -name '*.xcworkspace' -print -quit)"

          if [ -n "$PROJECT" ]; then
            xcodebuild -list -json -project "$PROJECT" | tee project-list.json
          elif [ -n "$WORKSPACE" ]; then
            xcodebuild -list -json -workspace "$WORKSPACE" | tee project-list.json
          else
            echo "ERRO: projeto Xcode nao encontrado."
            exit 1
          fi

      - name: Salvar relatorio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-cliente
          path: project-list.json
          if-no-files-found: warn
