name: Build Allan IOS EXTERNAL ADMIN

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-ipa:
    runs-on: macos-15

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Selecionar Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Compilar arquivo ARCHIVE
        run: |
          xcodebuild \
            -project 3105Admin.xcodeproj \
            -scheme '3105 ADMIN' \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/Allan-Admin.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Criar IPA sem assinatura
        run: |
          rm -rf Payload
          mkdir -p Payload
          cp -R "$RUNNER_TEMP/Allan-Admin.xcarchive/Products/Applications/AllanIOS.app" Payload/
          zip -qry "AllanIOS.ipa" Payload

      - name: Disponibilizar IPA para download
        uses: actions/upload-artifact@v4
        with:
          name: AllanIOS
          path: "AllanIOS.ipa"
