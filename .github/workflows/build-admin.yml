
name: Build 3105 ADMIN

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-admin:
    runs-on: macos-15

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Extrair projeto ADMIN
        run: |
          unzip -o "3105-ADMIN-PRONTO.zip" -d .

      - name: Localizar projeto
        id: project
        run: |
          echo "Projetos encontrados:"
          find . -name "*.xcodeproj" -print

          PROJECT=$(find . -name "*.xcodeproj" -type d -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "ERRO: Nenhum projeto Xcode encontrado."
            exit 1
          fi

          echo "Projeto: $PROJECT"
          echo "project_path=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Validar projeto
        run: |
          xcodebuild -list \
            -project "${{ steps.project.outputs.project_path }}"

      - name: Compilar ADMIN
        run: |
          xcodebuild \
            -project "${{ steps.project.outputs.project_path }}" \
            -scheme "3105 ADMIN" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/ADMIN.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Gerar IPA
        run: |
          APP=$(find "$RUNNER_TEMP/ADMIN.xcarchive/Products/Applications" -maxdepth 1 -name "*.app" -print -quit)

          if [ -z "$APP" ]; then
            echo "ERRO: Aplicativo não encontrado."
            exit 1
          fi

          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "3105-ADMIN.ipa" Payload

      - name: Disponibilizar IPA
        uses: actions/upload-artifact@v4
        with:
          name: 3105-ADMIN-IPA
          path: 3105-ADMIN.ipa
