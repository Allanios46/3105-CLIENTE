
name: Diagnostico 3105 ADMIN

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  diagnostico:
    runs-on: macos-15

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Mostrar estrutura completa
        run: |
          echo "===== DIRETORIO ATUAL ====="
          pwd

          echo "===== CONTEUDO DA RAIZ ====="
          ls -lah

          echo "===== TODAS AS PASTAS ====="
          find . -type d | head -300

          echo "===== ARQUIVOS XCODE ====="
          find . \( -name "*.xcodeproj" -o -name "*.xcworkspace" \) -print

          echo "===== ARQUIVOS SWIFT ====="
          find . -name "*.swift" -print | head -100

          echo "===== FIM DO DIAGNOSTICO ====="
